name: Deploy to Dock VPS

on:
  push:
    branches:
      - main
      - feat/clients-multi-service-auth

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${VPS_USER}@${VPS_HOST} \
            "set -e; BRANCH=${GITHUB_REF_NAME:-main}; cd ${DEPLOY_DIR:-/home/deploy/SmartPBXManager}; git fetch origin; git checkout \${BRANCH} || true; git pull origin \${BRANCH}; docker-compose up -d --build"
